<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Travel Safe — a safety net that checks on you">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef5f2"/>
      <stop offset="55%" stop-color="#f5f6f5"/>
      <stop offset="100%" stop-color="#e6efe9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f6f5c" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#1f6f5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d99a4e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d99a4e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#1c2024" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="170" cy="80" r="330" fill="url(#glow)"/>
  <circle cx="1080" cy="40" r="260" fill="url(#warm)"/>
  <circle cx="600" cy="640" r="320" fill="url(#glow)" opacity="0.55"/>

  <g transform="translate(88 74)">
    <rect width="72" height="72" rx="18" fill="#1f6f5c"/>
    <path d="M36 15l16.3 5.9v13.9c0 11.9-7 20.5-16.3 24.1-9.3-3.6-16.3-12.2-16.3-24.1V20.9L36 15z" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M26.6 36l6.6 6.5 12.6-13.5" fill="none" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="94" y="49" font-family="Manrope, DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="800" fill="#1c2024" letter-spacing="-1">Travel Safe</text>
  </g>

  <text x="88" y="262" font-family="Fraunces, Georgia, DejaVu Serif, serif" font-size="70" font-weight="600" fill="#1c2024" letter-spacing="-3">A safety net</text>
  <text x="88" y="350" font-family="Fraunces, Georgia, DejaVu Serif, serif" font-size="70" font-weight="600" fill="#1f6f5c" letter-spacing="-3.4">that checks on you.</text>

  <text x="90" y="408" font-family="Manrope, DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="500" fill="#5b6068">One tap to check in. Miss it, and the people you trust</text>
  <text x="90" y="442" font-family="Manrope, DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="500" fill="#5b6068">get your last location, 7-day trail and SOS media.</text>

  <g transform="translate(90 494)">
    <rect width="190" height="48" rx="24" fill="#ffffff" stroke="#dfe3e1"/>
    <circle cx="26" cy="24" r="5" fill="#1f6f5c"/>
    <text x="42" y="31" font-family="Manrope, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f6f5c">One-tap check-in</text>
  </g>
  <g transform="translate(298 494)">
    <rect width="190" height="48" rx="24" fill="#ffffff" stroke="#dfe3e1"/>
    <circle cx="26" cy="24" r="5" fill="#1f6f5c"/>
    <text x="42" y="31" font-family="Manrope, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f6f5c">7-day trail</text>
  </g>
  <g transform="translate(506 494)">
    <rect width="210" height="48" rx="24" fill="#ffffff" stroke="#dfe3e1"/>
    <circle cx="26" cy="24" r="5" fill="#b4232a"/>
    <text x="42" y="31" font-family="Manrope, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1c2024">SOS video / audio</text>
  </g>

  <g transform="translate(842 162)">
    <rect width="266" height="264" rx="26" fill="#ffffff" stroke="#dfe3e1"/>
    <rect x="16" y="16" width="234" height="132" rx="16" fill="#eef5f2"/>
    <path d="M48 122c18-8 26-34 48-32 20 2 22 22 42 12 18-9 30-34 52-30 16 3 22 20 24 38" fill="none" stroke="#1f6f5c" stroke-width="5" stroke-linecap="round"/>
    <circle cx="214" cy="110" r="9" fill="#1f6f5c"/>
    <circle cx="214" cy="110" r="18" fill="#1f6f5c" opacity="0.18"/>
    <rect x="16" y="164" width="112" height="12" rx="6" fill="#1c2024" opacity="0.75"/>
    <rect x="16" y="186" width="168" height="10" rx="5" fill="#5b6068" opacity="0.42"/>
    <rect x="16" y="220" width="96" height="30" rx="10" fill="#1f6f5c"/>
    <text x="30" y="240" font-family="Manrope, DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Open page</text>
    <circle cx="224" cy="234" r="16" fill="#fbe9e9"/>
    <path d="M224 226v10M224 241v1" stroke="#b4232a" stroke-width="2.6" stroke-linecap="round"/>
  </g>
