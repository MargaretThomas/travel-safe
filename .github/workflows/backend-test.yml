name: Backend Tests

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/code

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/code/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff pytest

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v
